version: "3.8"

services:

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: conduit-db
    environment:
      POSTGRES_DB: conduit
      POSTGRES_USER: conduit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-conduit}
    volumes:
      # Named volume — Docker manages ownership so postgres can always write here.
      # To back up: docker exec conduit-db pg_dump -U conduit conduit > backup.sql
      - conduit-postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conduit -d conduit"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Conduit ────────────────────────────────────────────────────────────────
  conduit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: conduit
    depends_on:
      db:
        condition: service_healthy   # wait for postgres to be ready
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # Bind mount for conduit app data (scripts, encryption key, logs).
      # Set DATA_DIR_HOST to use a custom path, e.g.:
      #   echo "DATA_DIR_HOST=/home/user/Docker/conduit" >> .env
      - ${DATA_DIR_HOST:-./conduit-data}:/data
    environment:
      DATA_DIR: /data
      DATABASE_URL: postgresql://conduit:${POSTGRES_PASSWORD:-conduit}@db:5432/conduit

      MAX_CONCURRENT_SCRIPTS: ${MAX_CONCURRENT_SCRIPTS:-10}
      METRICS_INTERVAL_SECONDS: ${METRICS_INTERVAL_SECONDS:-30}
      WARN_THRESHOLD: ${WARN_THRESHOLD:-0.75}
      CRITICAL_THRESHOLD: ${CRITICAL_THRESHOLD:-0.90}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      # Frontend and API share port 8000 in Docker so * is safe here.
      # For internet-facing deployments set an explicit origin instead.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}

      # Auth — disabled by default. Enable for any shared/public deployment.
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      # SECURITY: set a strong JWT_SECRET before exposing to a network.
      # Generate: python -c "import secrets; print(secrets.token_hex(32))"
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-24}

      # ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}

    restart: unless-stopped

    # Resource limits — uncomment and tune to your workload
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '2'
    #       memory: 2G
    #     reservations:
    #       cpus: '0.5'
    #       memory: 512M

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# ── Volumes ────────────────────────────────────────────────────────────────
volumes:
  conduit-postgres:
    # Docker-managed volume for PostgreSQL data. Stored at:
    # /var/lib/docker/volumes/conduit_conduit-postgres/_data
