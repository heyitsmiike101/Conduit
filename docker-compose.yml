version: "3.8"

services:
  conduit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: conduit
    ports:
      - "${BACKEND_PORT:-8000}:8000"
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      # Mount persistent data directory — configure via DATA_DIR_HOST environment variable
      # Default: ./conduit-data (creates in current directory)
      # Example: export DATA_DIR_HOST=/mnt/docker-data/conduit
      - ${DATA_DIR_HOST:-.}/conduit-data:/data
    environment:
      # Database
      DATA_DIR: /data
      DATABASE_URL: sqlite:////data/conduit.db

      # Backend server
      UVICORN_HOST: 0.0.0.0
      UVICORN_PORT: 8000

      # Configuration (override with env vars or .env file)
      MAX_CONCURRENT_SCRIPTS: ${MAX_CONCURRENT_SCRIPTS:-10}
      METRICS_INTERVAL_SECONDS: ${METRICS_INTERVAL_SECONDS:-30}
      WARN_THRESHOLD: ${WARN_THRESHOLD:-0.75}
      CRITICAL_THRESHOLD: ${CRITICAL_THRESHOLD:-0.90}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}

      # Auth (disabled by default for dev; enable with AUTH_ENABLED=true)
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-24}

      # Encryption (optional; auto-generated in /data/.secret_key if not provided)
      # ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}

    restart: unless-stopped

    # Resource limits (optional — adjust based on your system)
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '2'
    #       memory: 2G
    #     reservations:
    #       cpus: '1'
    #       memory: 1G

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Healthcheck
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# Named volume for persistence (alternative to host mount above)
# Uncomment to use Docker-managed volumes instead of host directories
# volumes:
#   conduit-data:
#     driver: local
